<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medieval Economy</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="view"></div>
      <aside id="panel">
        <section>
          <h1>Medieval Economy</h1>
          <p class="muted">
            <span id="status">connecting...</span> · tick <span id="tick">-</span>
          </p>
          <div class="row">
            <button id="toggle" disabled>Pause</button>
            <span id="speeds" class="row"></span>
          </div>
        </section>
        <section>
          <h2>World</h2>
          <form id="params"></form>
          <p id="config" class="muted small"></p>
          <div class="row">
            <button id="generate" disabled>Generate</button>
            <button id="reseed" disabled>New seed</button>
          </div>
        </section>
        <section>
          <h2>Resources</h2>
          <label
            >Overlay
            <select id="overlay"></select
          ></label>
          <label>Tile sprites <input type="checkbox" id="sprites" checked /></label>
          <ul id="totals"></ul>
        </section>
        <section>
          <h2>Folk</h2>
          <ul id="deciders"></ul>
          <div id="folk-detail" class="muted">Click a Folk to inspect it.</div>
        </section>
        <section>
          <h2>Stats</h2>
          <div id="stats"></div>
        </section>
        <section>
          <h2>Tile</h2>
          <div id="tile" class="muted">Click a tile to inspect it.</div>
        </section>
        <section>
          <h2>Legend</h2>
          <ul id="legend"></ul>
        </section>
        <p class="muted small">Drag to pan, scroll to zoom.</p>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
